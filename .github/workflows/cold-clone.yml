name: cold-clone

# Verify the event revision in a fresh checkout without sibling repositories.
# Build and test that same checkout to detect external path dependencies.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cold-clone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cold-clone
    steps:
      - uses: actions/checkout@v4
        with:
          path: cold-clone
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check from scratch clone
        run: cargo check --workspace --all-targets
      - name: cargo test from scratch clone
        run: cargo test --workspace --all-targets
