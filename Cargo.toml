[workspace]
resolver = "2"
members = [
    "crates/op-core",
    "crates/op-compiler",
    "crates/op-stdlib",
    "crates/op-lex-compiler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "Apache-2.0"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Testing
proptest = "1"

# Benchmarking
criterion = "0.5"
