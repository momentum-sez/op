[workspace]
resolver = "2"
members = [
    "crates/op-core",
    "crates/op-compiler",
    "crates/op-stdlib",
    "crates/op-lex-compiler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"

[workspace.dependencies]
mez-canonical = { git = "https://github.com/momentum-sez/lex.git", rev = "8d4056f3ba86cbded2a20e46edfe9a8b71f06929" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Testing
proptest = "1"

# Benchmarking
criterion = "0.5"
